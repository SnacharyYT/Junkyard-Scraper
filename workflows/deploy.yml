name: Deploy Dashboard to GoDaddy

on:
  schedule:
    - cron: '0 14 * * *' # Runs automatically every morning at 8:00 AM MST
  workflow_dispatch: # Allows you to manually trigger a test build

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Minimize Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Download Modules
      run: |
        pip install -r requirements.txt

    - name: Run Web Scraper Engine
      run: python scraper.py

    - name: Push Webpage straight to GoDaddy Storage
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.GODADDY_FTP_SERVER }}
        username: ${{ secrets.GODADDY_FTP_USERNAME }}
        password: ${{ secrets.GODADDY_FTP_PASSWORD }}
        server-dir: /jrscraper/ # Matches your GoDaddy folder directory path
        local-dir: ./
