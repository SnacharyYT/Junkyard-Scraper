name: Deploy Dashboard to GitHub Pages

on:
  schedule:
    - cron: '0 14 * * *' # Runs automatically every morning at 8:00 AM MST
  workflow_dispatch: # Allows you to manually trigger a test build

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Download Modules
      run: |
        pip install -r requirements.txt

    - name: Run Web Scraper Engine
      run: python scraper.py

    - name: Commit and Push index.html to Repository
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add index.html
        git commit -m "Automated daily inventory update" || echo "No changes to commit"
        git push

    - name: Upload artifact for Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
